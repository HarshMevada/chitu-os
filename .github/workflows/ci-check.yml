name: CI check (branch)
on:
  push:
    branches: [ci-check]
permissions:
  contents: read
jobs:
  firmware:
    name: Firmware (${{ matrix.label }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    strategy:
      fail-fast: false
      matrix:
        # One firmware per wake word. Words whose model is missing simply fail
        # here and are left out of the installer's wake word menu.
        include:
          - { key: wn9_hiesp, model: wn9_hiesp,         label: "Hi ESP" }
          # Custom phrases (MultiNet, no training). Retried now that the mic DC offset is fixed.
          # Trained wake words (microWakeWord). "Chitu" appears once its model is trained.
          - { key: micro_chitu,     model: "micro:chitu",     label: "Chitu (trained)" }
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Create the phone console certificate
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          # self-signed certificate for the https phone console (needed for the phone mic)
          command -v openssl >/dev/null || (apt-get update -qq && apt-get install -y -qq openssl)
          python3 main/boards/chitu/tools/make_cert.py main/boards/chitu/chitu_cert.h

      - name: Build
        shell: bash
        env:
          LANG_CODE: ${{ inputs.language || 'en-US' }}
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py chitu --language "$LANG_CODE" --wake-word "${{ matrix.model }}"

      - name: Decode crash backtrace (debug/backtrace.txt)
        if: matrix.model == 'wn9_hiesp' && hashFiles('debug/backtrace.txt') != ''
        shell: bash
        run: |
          source "$IDF_PATH/export.sh" > /dev/null
          echo "=== decoded backtrace ==="
          xtensa-esp32s3-elf-addr2line -pfiaC -e build/chitu.elf $(cat debug/backtrace.txt)

      - name: Collect flash parts
        shell: bash
        run: |
          # Separate parts (not one merged image) so re-installing keeps the saved Wi-Fi
          python3 - <<'PY'
          import json, os, shutil
          args = json.load(open("build/flasher_args.json"))
          out = "out/${{ matrix.key }}"
          os.makedirs(out, exist_ok=True)
          parts = []
          for offset, path in sorted(args["flash_files"].items(), key=lambda kv: int(kv[0], 16)):
              name = os.path.basename(path)
              shutil.copy(os.path.join("build", path), os.path.join(out, name))
              parts.append({"path": name, "offset": int(offset, 16)})
          json.dump({"label": "${{ matrix.label }}", "model": "${{ matrix.key }}", "parts": parts},
                    open(os.path.join(out, "parts.json"), "w"))
          print(parts)
          PY

      - name: Save ELF (for decoding crashes)
        if: matrix.model == 'wn9_hiesp'
        uses: actions/upload-artifact@v7
        with:
          name: chitu-elf
          path: build/chitu.elf

      - name: Save firmware
        uses: actions/upload-artifact@v7
        with:
          name: chitu-fw-${{ matrix.key }}
          path: out
          if-no-files-found: error

