# Builds Chitu OS in the cloud and publishes the web installer on GitHub Pages.
# Every push builds the firmware; only the main branch is published.
name: Build Chitu OS

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      language:
        description: "Language (en-US, hi-IN, ...)"
        default: "en-US"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Build (wake word "Chitu")
        shell: bash
        env:
          LANG_CODE: ${{ inputs.language || 'en-US' }}
        run: |
          git config --global --add safe.directory '*'
          source "$IDF_PATH/export.sh"
          python scripts/build.py chitu --language "$LANG_CODE" --wake-word "micro:chitu"

      - name: Firmware size
        continue-on-error: true
        shell: bash
        run: |
          source "$IDF_PATH/export.sh" > /dev/null
          idf.py -B build size | tail -25

      - name: Collect flash parts
        shell: bash
        run: |
          # Separate parts (not one merged image) so re-installing keeps the saved Wi-Fi
          python3 - <<'PY'
          import json, os, shutil
          args = json.load(open("build/flasher_args.json"))
          os.makedirs("out", exist_ok=True)
          parts = []
          for offset, path in sorted(args["flash_files"].items(), key=lambda kv: int(kv[0], 16)):
              name = os.path.basename(path)
              shutil.copy(os.path.join("build", path), os.path.join("out", name))
              parts.append({"path": name, "offset": int(offset, 16)})
          json.dump(parts, open("out/parts.json", "w"))
          print(parts)
          PY
          cp build/chitu.elf out/chitu.elf

      - name: Save firmware
        uses: actions/upload-artifact@v7
        with:
          name: chitu-firmware
          path: out
          if-no-files-found: error

  site:
    name: Prepare installer page
    needs: firmware
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Get firmware
        uses: actions/download-artifact@v8
        with:
          name: chitu-firmware
          path: site/firmware

      - name: Write manifest and version
        shell: bash
        run: |
          # The version comes from one place: PROJECT_VER / CHITU_RELEASE_NAME in CMakeLists.txt
          VER=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)
          REL=$(sed -n 's/^set(CHITU_RELEASE_NAME "\(.*\)")/\1/p' CMakeLists.txt)
          test -n "$VER"
          rm -f site/firmware/chitu.elf
          VER="$VER" REL="$REL" python3 - <<'PY'
          import json, os
          ver, rel = os.environ["VER"], os.environ["REL"]
          parts = json.load(open("site/firmware/parts.json"))
          manifest = {
              "name": "Chitu",
              "version": ver,
              "new_install_prompt_erase": False,
              "builds": [{"chipFamily": "ESP32-S3", "improv": False,
                          "parts": [{"path": "firmware/" + p["path"], "offset": p["offset"]} for p in parts]}],
          }
          json.dump(manifest, open("site/manifest.json", "w"), indent=2)
          json.dump({"version": ver, "release": rel}, open("site/version.json", "w"))
          PY
          sed -i "s/__VERSION__/$VER/g; s/__RELEASE__/$REL/g; s/__BUILD__/${GITHUB_SHA::7}/g" site/index.html
          ls -la site site/firmware

      - name: Package page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
