# What the robot should wake up to
name: chitu
wake_word: "Chitu"

# Ways a voice engine might say it (phonetic spellings help the TTS)
positive_phrases:
  - "chitu"
  - "chee too"
  - "cheetoo"
  - "chitoo"
  - "chee-too!"
  - "chitu?"
# Hindi voice (Indian pronunciation). Skipped if the voice cannot be downloaded.
positive_phrases_hindi:
  - "चीटू"
  - "चिटू"

# Similar-sounding words the robot must NOT wake up to
negative_phrases:
  - "cheetah"
  - "cheetos"
  - "peter"
  - "chew"
  - "chutney"
  - "chintu"
  - "jitu"
  - "pintu"
  - "kitty"
  - "city"
  - "chicken"
  - "teach you"
  - "reach to"
  - "she too"
  - "tutu"
  - "chitchat"
  - "cheat"
  - "two"

positive_samples_per_phrase: 700
hindi_samples_per_phrase: 400
negative_samples_per_phrase: 150

training_steps: 12000
